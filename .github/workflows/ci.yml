name: CI

# Build, check and test NM-Mobile on GitHub Actions only.
# No Flutter or Android SDK is ever installed on the NM production server.
# No signing key is stored in the repo: release builds are signed with the
# debug key unless the owner later adds ANDROID_KEYSTORE_* repository secrets.

on:
  push:
    branches: [main, "phase1*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the APK to a GitHub Release on tags

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: flutter test
        run: flutter test --reporter expanded

  apk:
    name: build release APK
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: build APK
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            flutter build apk --release --build-name "${GITHUB_REF_NAME#v}" --build-number "${GITHUB_RUN_NUMBER}"
          else
            flutter build apk --release --build-number "${GITHUB_RUN_NUMBER}"
          fi
      - name: rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/NM-Mobile-${GITHUB_REF_NAME//\//-}-${GITHUB_RUN_NUMBER}.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NM-Mobile-apk
          path: dist/*
          retention-days: 30
      - name: GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
